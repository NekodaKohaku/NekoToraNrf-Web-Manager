<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Firmware Update Tool</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --primary:#2563eb; --primary-hover:#1d4ed8; --border:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --warn-bg:#fef3c7; --warn-border:#f59e0b;
  --log-bg:#0f172a; --log-text:#94a3b8; --sel-bg:#eff6ff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#111a2e; --text:#e2e8f0; --muted:#94a3b8;
    --border:#1e293b; --warn-bg:#3b2f10; --warn-border:#a16207;
    --log-bg:#020617; --log-text:#7dd3fc; --sel-bg:#152447;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:24px;font-weight:700}
header .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
select#langSel{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px}
main{max-width:820px;margin:0 auto;padding:8px 20px 48px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:12px 16px;margin:12px 0;font-size:14px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin:14px 0;transition:opacity .2s}
.card.disabled{opacity:.45;pointer-events:none}
.stepHead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.stepNum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.stepHead h2{margin:0;font-size:17px;font-weight:600}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--border);color:var(--muted)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
@media (prefers-color-scheme: dark){ .badge.ok{background:#14532d;color:#bbf7d0} }
.card p.desc{margin:6px 0 14px;color:var(--muted);font-size:14px}

/* Method chooser. Rendered as a tab strip because that is what reads clearly
   at a glance, but it selects one shared flow rather than switching between
   three separate wizards - steps 2-4 below are the same markup for all three. */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 2px}
@media (max-width:640px){ .methods{grid-template-columns:1fr} }
.method{text-align:left;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.method:hover{border-color:var(--primary)}
.method[aria-selected="true"]{border-color:var(--primary);background:var(--sel-bg)}
.method .mName{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.method .mTag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--primary);color:#fff}
.method .mTag.alt{background:var(--border);color:var(--muted)}
.method .mDesc{color:var(--muted);font-size:13px;margin-top:5px}
.method .mNeed{color:var(--muted);font-size:12.5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}

.btn{appearance:none;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.alt{background:var(--border);color:var(--text)}
.linklike{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:6px 2px;text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:rgba(37,99,235,.06)}
.fileInfo{margin-top:12px;font-size:14px}
.fileInfo .fname{font-weight:600}
.fileInfo .ranges{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-line}
.holdBox{display:flex;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.holdBox .ico{flex:none;font-size:18px}

/* tracker list */
.trackers{margin:6px 0 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.trk{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}
.trk:last-child{border-bottom:none}
.trk.dim{opacity:.5}
.trk input{width:17px;height:17px;flex:none}
.trk .tName{font-weight:600;flex:none;min-width:6.5em}
.trk .tInfo{color:var(--muted);font-size:13px;flex:1}
.trk .tState{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--border);color:var(--muted);flex:none}
.trk .tState.upd{background:var(--primary);color:#fff}
.trk .tState.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){ .trk .tState.ok{background:#14532d;color:#bbf7d0} }

.progressWrap{margin-top:4px}
.stageRow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px;gap:10px}
#stageLabel{font-weight:600}
#pct{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;background:var(--border);border-radius:999px;overflow:hidden}
.bar>div{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#3b82f6);transition:width .2s}
.holdRemind{margin-top:12px;color:var(--err);font-weight:700;font-size:14px;text-align:center;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.result{text-align:center;padding:8px 0 4px}
.result .mark{font-size:52px;line-height:1.1}
.result.ok .mark{color:var(--ok)}
.result.bad .mark{color:var(--err)}
.result h3{margin:6px 0 4px;font-size:20px}
.result p{margin:2px 0 14px;color:var(--muted);font-size:14px}
.result p.errDetail{color:var(--err);font-size:13px;word-break:break-all;white-space:pre-line}
details.adv{margin:18px 4px}
details.adv>summary{cursor:pointer;color:var(--muted);font-size:14px;user-select:none}
.advBody{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:10px;font-size:14px}
.advSec{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--border)}
.advSec:first-child{margin-top:0;padding-top:0;border-top:none}
.optRow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.optRow select,.optRow input[type=text]{padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.logBox{background:var(--log-bg);color:var(--log-text);border-radius:10px;padding:10px 12px;margin-top:10px;height:190px;overflow-y:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.logBox .warn{color:#fbbf24}
.logBox .err{color:#f87171}
.logBtns{margin-top:8px;display:flex;gap:10px}
footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title">Firmware Update Tool</h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>
  <select id="langSel" aria-label="Language">
    <option value="zh">繁體中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
</header>
<main>
  <div id="unsupported" class="banner hidden"></div>

  <!-- Step 1: how to update -->
  <section class="card" id="card1">
    <div class="stepHead"><span class="stepNum">1</span><h2 data-i18n="step0Title"></h2></div>
    <p class="desc" data-i18n="step0Desc"></p>
    <div class="methods" id="methods" role="tablist"></div>
  </section>

  <!-- Step 2: connect (body swapped per method) -->
  <section class="card disabled" id="card2">
    <div class="stepHead"><span class="stepNum">2</span><h2 id="connTitle"></h2><span id="connStatus" class="badge"></span></div>
    <p class="desc" id="connDesc"></p>

    <!-- wireless -->
    <div id="paneOta" class="hidden">
      <div class="row">
        <button id="btnConnectDongle" class="btn primary" data-i18n="otaConnect"></button>
        <button id="btnRescan" class="linklike hidden" data-i18n="otaRescan"></button>
      </div>
      <div id="otaPick" class="hidden">
        <div class="stepHead" style="margin-top:16px"><h2 data-i18n="otaStepPick" style="font-size:15px"></h2></div>
        <div class="trackers" id="trackerList"></div>
        <div class="row">
          <button id="btnSelectAll" class="linklike" data-i18n="otaSelectAll"></button>
          <span id="otaSelCount" class="desc" style="margin:0"></span>
        </div>
      </div>
      <p id="otaNote" class="desc hidden"></p>
    </div>

    <!-- wired -->
    <div id="paneDfu" class="hidden">
      <div class="row">
        <button id="btnConnectSerial" class="btn primary" data-i18n="dfuConnect"></button>
        <select id="dfuBaud">
          <option value="115200" selected>115200</option>
          <option value="230400">230400</option>
          <option value="460800">460800</option>
        </select>
      </div>
      <div id="dfuModeBox" class="hidden" style="margin-top:16px">
        <div class="stepHead"><h2 data-i18n="dfuStepMode" style="font-size:15px"></h2><span id="dfuModeStatus" class="badge"></span></div>
        <p class="desc" data-i18n="dfuModeDesc"></p>
        <button id="btnEnterDfu" class="btn primary" data-i18n="dfuEnter"></button>
      </div>
    </div>

    <!-- SWD -->
    <div id="paneSwd" class="hidden">
      <button id="btnConnect" class="btn primary" data-i18n="connect"></button>
      <button id="btnConnectHid" class="linklike" data-i18n="connectHid"></button>
    </div>

    <p id="connErr" class="desc hidden" style="color:var(--err)"></p>
    <p id="devDetected" class="desc hidden" style="font-weight:600;color:var(--ok)"></p>
  </section>

  <!-- Step 3: firmware -->
  <section class="card disabled" id="card3">
    <div class="stepHead"><span class="stepNum">3</span><h2 data-i18n="fwAutoTitle"></h2><span id="fwStatus" class="badge"></span></div>
    <p class="desc" id="fwLine"></p>
    <div class="fileInfo hidden" id="fileInfo">
      <div class="fname" id="fileName"></div>
      <div class="ranges" id="fileRanges"></div>
      <button class="linklike" id="btnUseAuto" data-i18n="useAuto"></button>
    </div>
    <p id="fwErr" class="desc hidden" style="color:var(--err)"></p>
  </section>

  <!-- Step 4: update -->
  <section class="card disabled" id="card4">
    <div class="stepHead"><span class="stepNum">4</span><h2 data-i18n="step3Title"></h2></div>
    <div id="preUpdate">
      <div class="holdBox hidden" id="holdBox"><span class="ico">⚠️</span><span data-i18n="holdWarn"></span></div>
      <button id="btnStart" class="btn primary big" data-i18n="start"></button>
    </div>
    <div id="progressArea" class="hidden">
      <div class="progressWrap">
        <div class="stageRow"><span id="stageLabel"></span><span id="pct">0%</span></div>
        <div class="bar"><div id="barFill"></div></div>
      </div>
      <div class="holdRemind hidden" id="holdRemind" data-i18n="holdDuring"></div>
    </div>
    <div id="resultOk" class="result ok hidden">
      <div class="mark">✓</div>
      <h3 id="okTitle"></h3>
      <p id="okHint"></p>
      <button class="linklike" id="btnAgain" data-i18n="updateAnother"></button>
    </div>
    <div id="resultBad" class="result bad hidden">
      <div class="mark">✕</div>
      <h3 data-i18n="fail"></h3>
      <p id="badHint"></p>
      <p class="errDetail" id="errDetail"></p>
      <button class="btn primary" id="btnRetry" data-i18n="retry"></button>
    </div>
  </section>

  <!-- Advanced -->
  <details class="adv" id="advanced">
    <summary data-i18n="advanced"></summary>
    <div class="advBody">
      <div class="advSec">
        <div style="font-weight:600" data-i18n="advManual"></div>
        <p class="desc" data-i18n="advManualDesc"></p>
        <p class="desc" id="manualNeeds" style="font-weight:600"></p>
        <div class="drop" id="drop"><span data-i18n="dropHint"></span></div>
        <input type="file" id="fileInput" class="hidden">
      </div>
      <div class="advSec" id="swdOpts">
        <div style="font-weight:600">SWD</div>
        <div class="optRow"><input type="checkbox" id="optVerify" checked><label for="optVerify" data-i18n="optVerify"></label></div>
        <div class="optRow">
          <label for="optErase" data-i18n="optErase"></label>
          <select id="optErase">
            <option value="smart" selected data-i18n="eraseSmart"></option>
            <option value="full" data-i18n="eraseFull"></option>
            <option value="none" data-i18n="eraseNone"></option>
          </select>
        </div>
        <div class="optRow"><input type="checkbox" id="optForce"><label for="optForce" data-i18n="optForce"></label></div>
        <div class="optRow">
          <label for="optClock" data-i18n="optClock"></label>
          <select id="optClock">
            <option value="500000">500 kHz</option>
            <option value="1000000" selected>1 MHz</option>
            <option value="2000000">2 MHz</option>
            <option value="4000000">4 MHz</option>
            <option value="8000000">8 MHz</option>
          </select>
        </div>
      </div>
      <div class="advSec">
        <div style="font-weight:600" data-i18n="logTitle"></div>
        <div class="logBox" id="log"></div>
        <div class="logBtns">
          <button class="linklike" id="btnLogDl" data-i18n="logDownload"></button>
          <button class="linklike" id="btnLogClear" data-i18n="logClear"></button>
        </div>
      </div>
    </div>
  </details>
</main>
<footer><span data-i18n="footerNote"></span></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
