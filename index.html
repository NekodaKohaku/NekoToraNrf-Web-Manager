<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NekoTora Manager</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --primary:#2563eb; --primary-hover:#1d4ed8; --border:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --warn-bg:#fef3c7; --warn-border:#f59e0b;
  --log-bg:#0f172a; --log-text:#94a3b8; --sel-bg:#eff6ff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#111a2e; --text:#e2e8f0; --muted:#94a3b8;
    --border:#1e293b; --warn-bg:#3b2f10; --warn-border:#a16207;
    --log-bg:#020617; --log-text:#7dd3fc; --sel-bg:#152447;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:24px;font-weight:700}
header .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
select#langSel{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px}
main{max-width:820px;margin:0 auto;padding:8px 20px 48px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:12px 16px;margin:12px 0;font-size:14px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin:14px 0;transition:opacity .2s}
.card.disabled{opacity:.45;pointer-events:none}
.stepHead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.stepNum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.stepHead h2{margin:0;font-size:17px;font-weight:600}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--border);color:var(--muted)}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
@media (prefers-color-scheme: dark){ .badge.ok{background:#14532d;color:#bbf7d0} }
.card p.desc{margin:6px 0 14px;color:var(--muted);font-size:14px}

/* Method chooser. Rendered as a tab strip because that is what reads clearly
   at a glance, but it selects one shared flow rather than switching between
   three separate wizards - steps 2-4 below are the same markup for all three. */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 2px}
@media (max-width:640px){ .methods{grid-template-columns:1fr} }
.method{text-align:left;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.method:hover{border-color:var(--primary)}
.method[aria-selected="true"]{border-color:var(--primary);background:var(--sel-bg)}
.method .mName{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.method .mTag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--primary);color:#fff}
.method .mTag.alt{background:var(--border);color:var(--muted)}
.method .mDesc{color:var(--muted);font-size:13px;margin-top:5px}

.btn{appearance:none;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.alt{background:var(--border);color:var(--text)}
.linklike{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:6px 2px;text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:rgba(37,99,235,.06)}
.fileInfo{margin-top:12px;font-size:14px}
.fileInfo .fname{font-weight:600}
.fileInfo .ranges{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-line}
.holdBox{display:flex;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.holdBox .ico{flex:none;font-size:18px}

/* tracker list */
.trackers{margin:6px 0 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.trk{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}
.trk:last-child{border-bottom:none}
.trk.dim{opacity:.5}
.trk input{width:17px;height:17px;flex:none}
.trk .tName{font-weight:600;flex:none;min-width:6.5em}
.trk .tInfo{color:var(--muted);font-size:13px;flex:1}
.trk .tState{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--border);color:var(--muted);flex:none}
.trk .tState.upd{background:var(--primary);color:#fff}
.trk .tState.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){ .trk .tState.ok{background:#14532d;color:#bbf7d0} }

.progressWrap{margin-top:4px}
.stageRow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px;gap:10px}
#stageLabel{font-weight:600}
#pct{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;background:var(--border);border-radius:999px;overflow:hidden}
.bar>div{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#3b82f6);transition:width .2s}
/* One row per tracker during a wireless update. The image is streamed once and
   fanned out, so the shared bar above shows how much has been sent while these
   show how far each tracker has actually consumed - which is where they differ
   when one falls behind or drops out. */
details.rescue{margin-top:14px;font-size:13px;color:var(--muted)}
details.rescue>summary{cursor:pointer;user-select:none}
details.rescue ol{margin:8px 0 0;padding-left:20px;line-height:1.7}
.trk .tName.wide{min-width:9em}
.trkProgress{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.tp{display:flex;align-items:center;gap:10px;font-size:13px}
.tp .tpName{flex:none;min-width:6.5em;font-weight:600}
.tp .tpBar{flex:1;height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.tp .tpBar>div{height:100%;width:0;border-radius:999px;background:var(--primary);transition:width .2s}
.tp .tpState{flex:none;min-width:6em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tp.complete .tpBar>div{background:var(--ok)}
.tp.complete .tpState{color:var(--ok)}
.tp.failed .tpBar>div{background:var(--err);width:100%!important;opacity:.35}
.tp.failed .tpState{color:var(--err)}
.holdRemind{margin-top:12px;color:var(--err);font-weight:700;font-size:14px;text-align:center;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.result{text-align:center;padding:8px 0 4px}
.result .mark{font-size:52px;line-height:1.1}
.result.ok .mark{color:var(--ok)}
.result.bad .mark{color:var(--err)}
.result h3{margin:6px 0 4px;font-size:20px}
.result p{margin:2px 0 14px;color:var(--muted);font-size:14px;white-space:pre-line}
.result p.errDetail{color:var(--err);font-size:13px;word-break:break-all;white-space:pre-line}
details.adv{margin:18px 4px}
details.adv>summary{cursor:pointer;color:var(--muted);font-size:14px;user-select:none}
.advBody{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:10px;font-size:14px}
.advSec{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--border)}
.advSec:first-child{margin-top:0;padding-top:0;border-top:none}
.optRow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.optRow select,.optRow input[type=text]{padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.logBox{background:var(--log-bg);color:var(--log-text);border-radius:10px;padding:10px 12px;margin-top:10px;height:190px;overflow-y:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.logBox .warn{color:#fbbf24}
.logBox .err{color:#f87171}
.logBtns{margin-top:8px;display:flex;gap:10px}
footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px}
/* ---- manager shell ---- */
header .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.small{padding:7px 14px;font-size:14px}
nav.tabs{max-width:820px;margin:0 auto;padding:4px 20px 0;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
nav.tabs button{appearance:none;background:none;border:none;border-bottom:3px solid transparent;padding:9px 12px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--text);border-bottom-color:var(--primary);font-weight:600}
.page{padding-top:6px}
.homeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
@media (max-width:640px){ .homeGrid{grid-template-columns:1fr} }
.homeCard{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.homeCard:hover{border-color:var(--primary)}
.homeCard .hcT{font-weight:700;font-size:17px}
.homeCard .hcD{color:var(--muted);font-size:14px;margin-top:4px}
.noteBox{background:var(--sel-bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.noteBox ol{margin:6px 0 0;padding-left:20px;flex-basis:100%}
#uf2Box{display:block}
.trk .tBtn{flex:none}
.tState.warn{background:var(--warn-bg);color:var(--warn)}
.chCards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
@media (max-width:640px){ .chCards{grid-template-columns:repeat(2,1fr)} }
.chCard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chCard .chN{font-weight:700;font-size:17px}
.chCard .chF{color:var(--muted);font-size:13px}
.consoleIn{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlayBox{background:var(--card);color:var(--text);border-radius:16px;padding:20px 22px;max-width:440px;width:100%;border:1px solid var(--border)}
.overlayBox h3{margin:0 0 8px;font-size:18px}
#diagOut{height:auto;max-height:360px;white-space:pre-wrap}
table.help{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.help th,table.help td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
table.help th{color:var(--muted);font-weight:600;font-size:13px}
.ledDot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--border);vertical-align:middle}
.faq dt{font-weight:600;margin-top:12px}
.faq dd{margin:4px 0 0;color:var(--muted);font-size:14px}
/* Narrow screens: a device row wraps, details drop under the name so the
   status badge is never cut off at the edge. */
@media (max-width:640px){
  .trk{flex-wrap:wrap;row-gap:4px}
  .trk .tState{margin-left:auto}
  .trk .tInfo{order:5;flex-basis:100%;padding-left:28px}
  .trk .tBtn{order:4}
}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title">NekoTora Manager</h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>
  <div class="topbar">
    <span id="dongleChip" class="badge"></span>
    <button id="btnTopConnect" class="btn primary small" data-i18n="topConnect"></button>
    <select id="langSel" aria-label="Language">
      <option value="zh">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
</header>
<nav class="tabs" id="nav">
  <button data-page="home" data-i18n="navHome"></button>
  <button data-page="update" data-i18n="navUpdate"></button>
  <button data-page="manage" data-i18n="navManage"></button>
  <button data-page="help" data-i18n="navHelp"></button>
  <button data-page="diag" data-i18n="navDiag"></button>
</nav>

<main>
<div id="unsupported" class="banner hidden"></div>

<!-- ============================ home ============================= -->
<section class="page" id="pageHome">
  <p class="desc" data-i18n="homeIntro"></p>
  <div class="homeGrid">
    <button class="homeCard" data-go="update"><div class="hcT" data-i18n="homeUpdateT"></div><div class="hcD" data-i18n="homeUpdateD"></div></button>
    <button class="homeCard" data-go="manage"><div class="hcT" data-i18n="homeManageT"></div><div class="hcD" data-i18n="homeManageD"></div></button>
    <button class="homeCard" data-go="help"><div class="hcT" data-i18n="homeHelpT"></div><div class="hcD" data-i18n="homeHelpD"></div></button>
    <button class="homeCard" data-go="diag"><div class="hcT" data-i18n="homeDiagT"></div><div class="hcD" data-i18n="homeDiagD"></div></button>
  </div>
</section>

<!-- =========================== update ============================ -->
<section class="page hidden" id="pageUpdate">
<!-- Step 2: connect (body swapped per method) -->
  <section class="card disabled" id="card2">
    <div class="stepHead"><span class="stepNum" id="stepNum2">1</span><h2 id="connTitle"></h2><span id="connStatus" class="badge"></span></div>
    <p class="desc" id="connDesc"></p>

    <!-- wireless -->
    <div id="paneOta" class="hidden">
      <div class="row">
        <button id="btnConnectDongle" class="btn primary" data-i18n="otaConnect"></button>
        <button id="btnRescan" class="linklike hidden" data-i18n="otaRescan"></button>
      </div>
      <div id="otaPick" class="hidden">
        <div class="stepHead" style="margin-top:16px"><h2 data-i18n="otaStepPick" style="font-size:15px"></h2></div>
        <div class="trackers" id="dongleList" style="margin-bottom:10px"></div>
        <div class="trackers" id="trackerList"></div>
        <div class="row">
          <button id="btnSelectAll" class="linklike" data-i18n="otaSelectAll"></button>
          <span id="otaSelCount" class="desc" style="margin:0"></span>
        </div>
      </div>
      <p id="otaNote" class="desc hidden"></p>
      <div id="wakeBox" class="noteBox hidden"><span id="wakeText"></span>
        <button id="btnWakeScan" class="btn alt small" data-i18n="wakeScan"></button></div>
      <p id="otaFwLine" class="desc" style="white-space:pre-line"></p>
      <!-- The one path that works when the dongle itself will not: its UF2
           bootloader never changes, so a dongle whose application is broken
           still comes up as a USB drive. Shown whether or not a dongle is
           connected - a dongle that needs this cannot be connected. -->
      <details class="rescue hidden" id="dongleRescue">
        <summary data-i18n="rescueTitle"></summary>
        <ol>
          <li><span data-i18n="rescueStep1"></span> <a id="rescueLink" href="#" download></a></li>
          <li><span data-i18n="rescueStep2"></span>
              <button id="btnRescue" class="linklike hidden" data-i18n="rescueEnter"></button></li>
          <li data-i18n="rescueStep3"></li>
        </ol>
      </details>
    </div>

    <!-- wired -->
    <div id="paneDfu" class="hidden">
      <div class="row">
        <button id="btnConnectSerial" class="btn primary" data-i18n="dfuConnect"></button>
      </div>
      <div id="dfuModeBox" class="hidden" style="margin-top:16px">
        <div class="stepHead"><h2 data-i18n="dfuStepMode" style="font-size:15px"></h2><span id="dfuModeStatus" class="badge"></span></div>
        <button id="btnEnterDfu" class="btn primary" data-i18n="dfuEnter"></button>
      </div>
    </div>

    <!-- SWD -->
    <div id="paneSwd" class="hidden">
      <button id="btnConnect" class="btn primary" data-i18n="connect"></button>
      <button id="btnConnectHid" class="linklike" data-i18n="connectHid"></button>
    </div>

    <p id="connErr" class="desc hidden" style="color:var(--err)"></p>
    <p id="devDetected" class="desc hidden" style="font-weight:600;color:var(--ok)"></p>
  </section>

  
<!-- Step 3: firmware -->
  <section class="card disabled" id="card3">
    <div class="stepHead"><span class="stepNum" id="stepNum3">2</span><h2 data-i18n="fwAutoTitle"></h2><span id="fwStatus" class="badge"></span></div>
    <p class="desc" id="fwLine" style="white-space:pre-line"></p>
    <div class="fileInfo hidden" id="fileInfo">
      <div class="fname" id="fileName"></div>
      <div class="ranges" id="fileRanges"></div>
      <button class="linklike" id="btnUseAuto" data-i18n="useAuto"></button>
    </div>
    <p id="fwErr" class="desc hidden" style="color:var(--err)"></p>
  <div id="uf2Box" class="noteBox hidden">
    <div data-i18n="uf2Title" style="font-weight:600"></div>
    <ol><li data-i18n="uf2Step1"></li><li><span data-i18n="uf2Step2"></span>
      <button id="btnUf2" class="linklike" data-i18n="uf2Enter"></button></li><li data-i18n="uf2Step3"></li></ol>
  </div>
  </section>
<!-- Step 4: update -->
  <section class="card disabled" id="card4">
    <div class="stepHead"><span class="stepNum" id="stepNum4">3</span><h2 data-i18n="step3Title"></h2></div>
    <div id="preUpdate">
      <div class="holdBox hidden" id="holdBox"><span class="ico">⚠️</span><span data-i18n="holdWarn"></span></div>
      <button id="btnStart" class="btn primary big"></button>
    </div>
    <div id="progressArea" class="hidden">
      <div class="progressWrap">
        <div class="stageRow"><span id="stageLabel"></span><span id="pct">0%</span></div>
        <div class="bar"><div id="barFill"></div></div>
      </div>
      <div class="trkProgress hidden" id="trkProgress"></div>
      <div class="holdRemind hidden" id="holdRemind" data-i18n="holdDuring"></div>
    </div>
    <div id="resultOk" class="result ok hidden">
      <div class="mark">✓</div>
      <h3 id="okTitle"></h3>
      <p id="okHint"></p>
      <button class="linklike" id="btnAgain" data-i18n="updateAnother"></button>
    </div>
    <div id="resultBad" class="result bad hidden">
      <div class="mark">✕</div>
      <h3 data-i18n="fail"></h3>
      <p id="badHint"></p>
      <p class="errDetail" id="errDetail"></p>
      <button class="btn primary" id="btnRetry" data-i18n="retry"></button>
    </div>
  </section>

  
<!-- Other ways to update: the three methods, wireless first. Kept below
     the wireless flow; picking wired or SWD swaps the connect card above. -->
<section class="card" id="card1">
  <div class="stepHead"><h2 data-i18n="otherTitle"></h2></div>
  <p class="desc" data-i18n="otherDesc"></p>
  <div class="methods" id="methods" role="tablist"></div>
</section>

<!-- Advanced -->
  <details class="adv" id="advanced">
    <summary data-i18n="advanced"></summary>
    <div class="advBody">
      <div class="advSec">
        <div style="font-weight:600" data-i18n="advManual"></div>
        <p class="desc" data-i18n="advManualDesc"></p>
        <p class="desc" id="manualNeeds" style="font-weight:600"></p>
        <div class="drop" id="drop"><span data-i18n="dropHint"></span></div>
        <input type="file" id="fileInput" class="hidden">
      </div>
      <div class="advSec" id="swdOpts">
        <div style="font-weight:600">SWD</div>
        <div class="optRow"><input type="checkbox" id="optVerify" checked><label for="optVerify" data-i18n="optVerify"></label></div>
        <div class="optRow">
          <label for="optErase" data-i18n="optErase"></label>
          <select id="optErase">
            <option value="smart" selected data-i18n="eraseSmart"></option>
            <option value="full" data-i18n="eraseFull"></option>
            <option value="none" data-i18n="eraseNone"></option>
          </select>
        </div>
        <div class="optRow"><input type="checkbox" id="optForce"><label for="optForce" data-i18n="optForce"></label></div>
        <div class="optRow">
          <label for="optClock" data-i18n="optClock"></label>
          <select id="optClock">
            <option value="500000">500 kHz</option>
            <option value="1000000" selected>1 MHz</option>
            <option value="2000000">2 MHz</option>
            <option value="4000000">4 MHz</option>
            <option value="8000000">8 MHz</option>
          </select>
        </div>
      </div>
      <div class="advSec">
        <div style="font-weight:600" data-i18n="logTitle"></div>
        <div class="logBox" id="log"></div>
        <div class="logBtns">
          <button class="linklike" id="btnLogDl" data-i18n="logDownload"></button>
          <button class="linklike" id="btnLogClear" data-i18n="logClear"></button>
        </div>
      </div>
    </div>
  </details>
</section>

<!-- =========================== manage ============================ -->
<section class="page hidden" id="pageManage">
  <section class="card" id="manageNeed">
    <p class="desc" data-i18n="needDongle"></p>
    <button id="btnManageConnect" class="btn primary" data-i18n="topConnect"></button>
  </section>
  <div id="manageBody" class="hidden">
    <section class="card">
      <div class="stepHead"><h2 data-i18n="mgTrackersTitle"></h2><span id="mgSummary" class="badge"></span></div>
      <p class="desc" data-i18n="mgTrackersDesc"></p>
      <div class="row">
        <button id="btnDozeAll" class="btn primary" data-i18n="mgDozeAll"></button>
        <button id="btnWakeAll" class="btn alt" data-i18n="mgWakeAll"></button>
      </div>
      <p id="mgMsg" class="desc hidden" style="margin-top:10px"></p>
      <div class="trackers" id="mgList" style="margin-top:12px"></div>
    </section>
    <section class="card">
      <div class="stepHead"><h2 data-i18n="mgPairTitle"></h2></div>
      <p class="desc" data-i18n="mgPairDesc"></p>
      <div class="row">
        <button id="btnPairOn" class="btn primary" data-i18n="mgPairOn"></button>
        <button id="btnPairOff" class="btn alt" data-i18n="mgPairOff"></button>
      </div>
      <p id="mgPairMsg" class="desc hidden" style="margin-top:10px"></p>
    </section>
    <section class="card">
      <div class="stepHead"><h2 data-i18n="mgChTitle"></h2></div>
      <p class="desc" data-i18n="mgChDesc"></p>
      <div class="chCards" id="chCards"></div>
      <p id="mgChMsg" class="desc hidden" style="margin-top:10px"></p>
      <p class="desc" data-i18n="mgChNote" style="margin-top:10px"></p>
    </section>
    <details class="adv" id="consoleBox">
      <summary data-i18n="mgConsoleTitle"></summary>
      <div class="advBody">
        <p class="desc" data-i18n="mgConsoleDesc"></p>
        <button id="btnConsoleConnect" class="btn alt" data-i18n="mgConsoleConnect"></button>
        <div class="logBox" id="consoleOut"></div>
        <div class="row" style="margin-top:8px">
          <input type="text" id="consoleIn" class="consoleIn" data-i18n-ph="mgConsolePh" disabled>
          <button id="btnConsoleSend" class="btn primary small" data-i18n="mgConsoleSend" disabled></button>
        </div>
      </div>
    </details>
  </div>
</section>

<!-- ============================ help ============================= -->
<section class="page hidden" id="pageHelp">
  <div id="helpBody"></div>
</section>

<!-- ======================== diagnostics ========================== -->
<section class="page hidden" id="pageDiag">
  <section class="card">
    <div class="stepHead"><h2 data-i18n="diagTitle"></h2></div>
    <p class="desc" data-i18n="diagDesc"></p>
    <div class="row">
      <button id="btnDiagMake" class="btn primary" data-i18n="diagMake"></button>
      <button id="btnDiagDl" class="btn alt" data-i18n="diagDownload" disabled></button>
      <button id="btnDiagCopy" class="btn alt" data-i18n="diagCopy" disabled></button>
    </div>
    <pre id="diagOut" class="logBox hidden"></pre>
  </section>
</section>

<!-- confirm overlay (a plain element: <dialog> is not available everywhere
     the page is tested) -->
<div id="confirmOverlay" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="overlayBox">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText" style="white-space:pre-line"></p>
    <div class="row" style="justify-content:flex-end">
      <button id="btnConfirmNo" class="btn alt" data-i18n="cancel"></button>
      <button id="btnConfirmYes" class="btn primary" data-i18n="confirm"></button>
    </div>
  </div>
</div>
</main>
<footer><span data-i18n="footerNote"></span></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
